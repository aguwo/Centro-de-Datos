# Paso 24: publicar el agente solo.
# Cada vez que se sube un cambio a main que toca el servidor del agente (supabase/functions/),
# GitHub corre las pruebas y, si pasan, publica la función "mcp" en Supabase.
# Necesita un secreto en GitHub: SUPABASE_ACCESS_TOKEN (una llave de acceso de tu cuenta de Supabase).
# Los cambios de estructura de la base (supabase/migrations/) se siguen pegando a mano en el SQL Editor.
name: Publicar agente

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "tests/**", ".github/workflows/publicar-agente.yml"]
  workflow_dispatch: {} # botón "Run workflow" para publicar a mano desde GitHub

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Pruebas: si alguna falla, no se publica nada.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      # 2. Publicar la función en Supabase (como el comando que corrías en PowerShell).
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy mcp --project-ref fugvincuaakcnvujtqlt --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
