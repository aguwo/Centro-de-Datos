<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de datos</title>
  <!--
    Pasos 9 a 11: la web con el mapa de tu grafo.
    1. Inicias sesión con tu correo (Supabase Auth).
    2. La página lee tus nodos y conexiones directo de Supabase. RLS (paso 5) asegura que solo lleguen los tuyos.
    3. Cytoscape, una librería de grafos, los dibuja: cada nodo es un punto con el color de su tipo
       y cada conexión es una flecha.
    4. Al hacer clic en un nodo se abre un panel con sus datos y sus vecinos, y el mapa ilumina
       solo ese nodo y lo que está conectado a él. Clic en el fondo para volver a ver todo.
    5. "+ Nuevo" crea un nodo (y su primera conexión); "Editar" y "Archivar" lo modifican.
  -->
  <style>
    :root { --fondo:#fafaf9; --texto:#1c1917; --suave:#78716c; --borde:#e7e5e4; --acento:#ea580c; }
    @media (prefers-color-scheme: dark) { :root { --fondo:#141210; --texto:#f5f5f4; --suave:#a8a29e; --borde:#3a3532; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--fondo); color:var(--texto); display:flex; flex-direction:column; }
    header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--borde); flex-wrap:wrap; }
    header h1 { font-size:1rem; margin:0; margin-right:auto; }
    .leyenda { display:flex; gap:12px; flex-wrap:wrap; font-size:.8rem; color:var(--suave); }
    .leyenda span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; background:var(--c); vertical-align:-1px; }
    button { padding:6px 12px; border-radius:8px; font:inherit; cursor:pointer; border:1px solid var(--borde); background:transparent; color:inherit; }
    button.principal { background:var(--acento); border-color:var(--acento); color:#fff; }
    main { flex:1; min-height:0; display:flex; }
    #grafo { flex:1; min-width:0; }
    #panel { width:320px; border-left:1px solid var(--borde); padding:16px; overflow-y:auto; }
    #panel h2 { font-size:1.15rem; margin:4px 0 12px; }
    .chip { display:inline-block; font-size:.75rem; padding:2px 8px; border-radius:999px; color:#fff; background:var(--c); }
    dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0 0 16px; font-size:.9rem; }
    dt { color:var(--suave); }
    dd { margin:0; }
    .contenido { white-space:pre-wrap; font-size:.9rem; border-top:1px solid var(--borde); padding-top:12px; margin-bottom:16px; }
    #panel h3 { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:var(--suave); margin:0 0 8px; }
    #panel ul { list-style:none; padding:0; margin:0; }
    #panel li button { width:100%; text-align:left; border:0; border-radius:6px; padding:6px 8px; display:flex; gap:8px; align-items:center; }
    #panel li button:hover { background:var(--borde); }
    .rel { color:var(--suave); font-size:.8rem; margin-left:auto; white-space:nowrap; }
    form.nodo label { display:block; font-size:.8rem; color:var(--suave); margin:10px 0 4px; }
    form.nodo input, form.nodo select, form.nodo textarea { width:100%; padding:8px 10px; border:1px solid var(--borde); border-radius:8px; background:transparent; color:inherit; font:inherit; }
    form.nodo textarea { min-height:90px; resize:vertical; }
    form.nodo select option { background:var(--fondo); }
    .acciones { display:flex; gap:8px; margin:16px 0; }
    @media (max-width: 700px) { main { flex-direction:column; } #panel { width:auto; max-height:45%; border-left:0; border-top:1px solid var(--borde); } }
    .centro { max-width:400px; margin:64px auto; padding:0 16px; }
    .centro input { width:100%; padding:10px 12px; border:1px solid var(--borde); border-radius:8px; background:transparent; color:inherit; font:inherit; margin:8px 0 12px; }
    .oculto { display:none !important; }
    #mensaje { color:var(--suave); text-align:center; padding:8px; margin:0; }
  </style>
</head>
<body>
  <section id="login" class="centro oculto">
    <h1>Centro de datos</h1>
    <p>Entra con tu correo. Te llega un enlace para iniciar sesión.</p>
    <form id="form-login">
      <input id="correo" type="email" placeholder="tu@correo.cl" required>
      <button class="principal">Enviar enlace</button>
    </form>
  </section>

  <header id="barra" class="oculto">
    <h1>Centro de datos</h1>
    <div class="leyenda" id="leyenda"></div>
    <button id="nuevo" class="principal">+ Nuevo</button>
    <button id="salir">Salir</button>
  </header>
  <main id="app" class="oculto">
    <div id="grafo"></div>
    <aside id="panel" class="oculto"></aside>
  </main>
  <p id="mensaje"></p>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm";
  import cytoscape from "https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/+esm";
  import { SUPABASE_URL, SUPABASE_KEY } from "./config.js";

  const db = createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  const avisar = (t) => ($("mensaje").textContent = t);

  // Un color por tipo, para reconocerlos de un vistazo.
  const COLORES = {
    area: "#2563eb", objetivo: "#7c3aed", hito: "#db2777", proyecto: "#ea580c",
    tarea: "#16a34a", evento: "#0891b2", nota: "#ca8a04", topico: "#64748b",
  };

  function mostrarApp(conSesion) {
    $("login").classList.toggle("oculto", conSesion);
    $("barra").classList.toggle("oculto", !conSesion);
    $("app").classList.toggle("oculto", !conSesion);
  }

  const ESTADOS = ["Inbox", "Por hacer", "En curso", "Esperando", "Hecho"]; // los mismos del paso 3
  let tipos = [];    // los tipos disponibles (tus propios tipos ganan sobre las plantillas)

  // Lee tus nodos y conexiones. No hace falta filtrar por dueño: RLS ya lo hace.
  // enfocarId: si viene, después de dibujar se enfoca ese nodo (útil tras crear o editar).
  async function cargarGrafo(enfocarId) {
    avisar("Cargando tu grafo…");
    const [nodos, conexiones, listaTipos] = await Promise.all([
      db.from("nodos").select("id, titulo, contenido, estado, fecha, props, tipos!inner(clave, nombre)").eq("archivado", false),
      db.from("conexiones").select("id, origen_id, relacion, destino_id").is("valido_hasta", null),
      db.from("tipos").select("id, owner_id, clave, nombre, propiedades, conexiones").order("nombre"),
    ]);
    const error = nodos.error || conexiones.error || listaTipos.error;
    if (error) return avisar(error.message);
    // Si tienes tu propia versión de un tipo, se usa esa en vez de la plantilla.
    const porClave = new Map();
    for (const t of listaTipos.data) if (!porClave.has(t.clave) || t.owner_id) porClave.set(t.clave, t);
    tipos = [...porClave.values()];
    avisar(nodos.data.length ? "" : "Todavía no tienes nodos. Crea el primero con «+ Nuevo».");
    dibujar(nodos.data, conexiones.data);
    if (enfocarId && cy.getElementById(enfocarId).length) enfocar(enfocarId);
  }

  // Convierte las filas de Supabase en los "elementos" que entiende Cytoscape y los dibuja.
  let cy;            // el grafo dibujado
  let nodosPorId;    // para encontrar rápido los datos completos de cada nodo

  function dibujar(nodos, conexiones) {
    nodosPorId = new Map(nodos.map((n) => [n.id, n]));
    const ids = new Set(nodos.map((n) => n.id));
    const elementos = [
      ...nodos.map((n) => ({
        data: { id: n.id, label: n.titulo, tipo: n.tipos.clave, color: COLORES[n.tipos.clave] ?? "#78716c", hecho: n.estado === "Hecho" },
      })),
      ...conexiones
        .filter((c) => ids.has(c.origen_id) && ids.has(c.destino_id)) // por si alguna apunta a un nodo archivado
        .map((c) => ({ data: { id: c.id, source: c.origen_id, target: c.destino_id, label: c.relacion.replaceAll("_", " ") } })),
    ];

    const estilo = getComputedStyle(document.documentElement);
    const texto = estilo.getPropertyValue("--texto").trim();
    const suave = estilo.getPropertyValue("--suave").trim();
    const fondo = estilo.getPropertyValue("--fondo").trim();

    if (cy) cy.destroy(); // al recargar, se reemplaza el mapa anterior
    cy = cytoscape({
      container: $("grafo"),
      elements: elementos,
      layout: { name: "cose", animate: false, nodeRepulsion: 9000, idealEdgeLength: 90 },
      style: [
        { selector: "node", style: {
            "background-color": "data(color)", label: "data(label)", color: texto,
            "font-size": 12, "text-valign": "bottom", "text-margin-y": 6, width: 26, height: 26,
        } },
        { selector: "node[tipo = 'area'], node[tipo = 'objetivo']", style: { width: 40, height: 40, "font-weight": "bold" } },
        { selector: "node[?hecho]", style: { opacity: 0.45 } },
        // Clases para el modo "enfoque": lo que no es vecino del nodo elegido se apaga.
        { selector: ".apagado", style: { opacity: 0.12 } },
        { selector: "node.elegido", style: { "border-width": 3, "border-color": texto } },
        { selector: "edge", style: {
            width: 1.5, "line-color": suave, "target-arrow-color": suave, "target-arrow-shape": "triangle",
            "curve-style": "bezier", label: "data(label)", "font-size": 9, color: suave, "text-rotation": "autorotate",
            "text-background-color": fondo, "text-background-opacity": 1, "text-background-padding": 2,
        } },
      ],
    });

    cy.on("tap", "node", (e) => enfocar(e.target.id()));
    cy.on("tap", (e) => { if (e.target === cy) desenfocar(); });

    $("leyenda").replaceChildren(...[...new Set(nodos.map((n) => n.tipos.clave))].map((clave) => {
      const s = document.createElement("span");
      s.style.setProperty("--c", COLORES[clave] ?? "#78716c");
      s.textContent = nodos.find((n) => n.tipos.clave === clave).tipos.nombre;
      return s;
    }));
  }

  // Atajo para crear elementos HTML: el("span", { textContent: "hola" }, ...hijos)
  function el(tag, props = {}, ...hijos) {
    const x = Object.assign(document.createElement(tag), props);
    x.append(...hijos);
    return x;
  }

  // Ilumina el nodo y sus vecinos directos, y muestra el panel.
  function enfocar(id) {
    const nodo = cy.getElementById(id);
    const vecindario = nodo.closedNeighborhood(); // el nodo + sus conexiones + los nodos al otro lado
    cy.elements().removeClass("elegido").addClass("apagado");
    vecindario.removeClass("apagado");
    nodo.addClass("elegido");
    cy.animate({ center: { eles: nodo } }, { duration: 300 });
    mostrarPanel(id, nodo);
  }

  function desenfocar() {
    cy.elements().removeClass("apagado elegido");
    $("panel").classList.add("oculto");
    cy.resize(); // el mapa recupera el ancho que usaba el panel
  }

  // Arma el panel con los datos del nodo y la lista de vecinos (clic en uno para saltar a él).
  function mostrarPanel(id, nodo) {
    const n = nodosPorId.get(id);

    const chip = el("span", { className: "chip", textContent: n.tipos.nombre });
    chip.style.setProperty("--c", COLORES[n.tipos.clave] ?? "#78716c");

    const datos = el("dl");
    const fila = (k, v) => { if (v !== null && v !== undefined && v !== "") datos.append(el("dt", { textContent: k }), el("dd", { textContent: String(v) })); };
    fila("Estado", n.estado);
    // La fecha se muestra tal como está guardada (sin convertir de zona horaria, que la correría un día).
    fila("Fecha", n.fecha && n.fecha.slice(0, 10).split("-").reverse().join("-"));
    for (const [k, v] of Object.entries(n.props ?? {})) fila(k, typeof v === "object" ? JSON.stringify(v) : v);

    const lista = el("ul");
    nodo.connectedEdges().forEach((arista) => {
      const sale = arista.source().id() === id;              // ¿la flecha sale de este nodo o llega a él?
      const otro = sale ? arista.target() : arista.source();
      const relacion = arista.data("label");
      const boton = el("button", {}, el("span", { textContent: otro.data("label") }),
        el("span", { className: "rel", textContent: sale ? `${relacion} →` : `← ${relacion}` }));
      boton.onclick = () => enfocar(otro.id());
      lista.append(el("li", {}, boton));
    });

    const editar = el("button", { textContent: "Editar" });
    editar.onclick = () => formulario(n);
    const archivar = el("button", { textContent: "Archivar" });
    archivar.onclick = async () => {
      if (!confirm(`¿Archivar "${n.titulo}"? Desaparece del mapa, pero no se borra.`)) return;
      const { error } = await db.from("nodos").update({ archivado: true }).eq("id", n.id);
      if (error) return avisar(error.message);
      $("panel").classList.add("oculto");
      cargarGrafo();
    };

    $("panel").replaceChildren(
      chip,
      el("h2", { textContent: n.titulo }),
      el("div", { className: "acciones" }, editar, archivar),
      datos,
      ...(n.contenido ? [el("div", { className: "contenido", textContent: n.contenido })] : []),
      el("h3", { textContent: `Conectado con (${nodo.connectedEdges().length})` }),
      nodo.connectedEdges().length ? lista : el("p", { className: "rel", textContent: "Sin conexiones todavía." }),
    );
    $("panel").classList.remove("oculto");
    cy.resize(); // el mapa se ajusta al espacio que deja el panel
  }

  // Formulario para crear (sin nodo) o editar (con nodo). Se muestra en el mismo panel.
  function formulario(n) {
    const editando = !!n;
    const campo = (etiqueta, control) => [el("label", { textContent: etiqueta }), control];

    const tipo = el("select", { required: true, disabled: editando });
    for (const t of tipos) tipo.append(el("option", { value: t.clave, textContent: t.nombre, selected: n?.tipos.clave === t.clave }));
    if (!editando) tipo.value = "tarea";

    const titulo = el("input", { required: true, value: n?.titulo ?? "", placeholder: "Ej: Estudiar cálculo" });
    const estado = el("select");
    estado.append(el("option", { value: "", textContent: "—" }), ...ESTADOS.map((e) => el("option", { value: e, textContent: e })));
    estado.value = n?.estado ?? (editando ? "" : "Inbox");
    const fecha = el("input", { type: "date", value: n?.fecha ? n.fecha.slice(0, 10) : "" });
    const contenido = el("textarea", { value: n?.contenido ?? "", placeholder: "Notas, detalles…" });

    // Primera conexión (solo al crear): relación + nodo de destino, según lo que permite el tipo.
    const relacion = el("select");
    const destino = el("select");
    const bloqueConexion = el("div");

    const tipoElegido = () => tipos.find((t) => t.clave === tipo.value);
    function ajustarCampos() {
      const t = tipoElegido();
      const props = t?.propiedades ?? [];
      const usa = (...clases) => props.some((p) => clases.includes(p.tipo));
      bloqueEstado.classList.toggle("oculto", !usa("estado"));
      bloqueFecha.classList.toggle("oculto", !usa("fecha", "fecha_hora"));
      relacion.replaceChildren(el("option", { value: "", textContent: "(sin conexión)" }),
        ...(t?.conexiones ?? []).map((c) => el("option", { value: c.relacion, textContent: c.relacion.replaceAll("_", " ") })));
      ajustarDestinos();
    }
    function ajustarDestinos() {
      const regla = (tipoElegido()?.conexiones ?? []).find((c) => c.relacion === relacion.value);
      const candidatos = regla ? [...nodosPorId.values()].filter((x) => regla.hacia.includes(x.tipos.clave)) : [];
      destino.replaceChildren(...candidatos.map((x) => el("option", { value: x.id, textContent: `${x.titulo} (${x.tipos.nombre})` })));
      destino.disabled = !candidatos.length;
    }
    const bloqueEstado = el("div", {}, ...campo("Estado", estado));
    const bloqueFecha = el("div", {}, ...campo("Fecha", fecha));
    bloqueConexion.append(...campo("Conectar a", relacion), destino);
    destino.style.marginTop = "6px";
    tipo.onchange = ajustarCampos;
    relacion.onchange = ajustarDestinos;

    const guardar = el("button", { className: "principal", textContent: editando ? "Guardar" : "Crear", type: "submit" });
    const cancelar = el("button", { textContent: "Cancelar", type: "button" });
    cancelar.onclick = () => (editando ? enfocar(n.id) : desenfocar());

    const form = el("form", { className: "nodo" },
      el("h2", { textContent: editando ? "Editar nodo" : "Nuevo nodo" }),
      ...campo("Tipo", tipo), ...campo("Título", titulo), bloqueEstado, bloqueFecha,
      ...campo("Contenido", contenido),
      ...(editando ? [] : [bloqueConexion]),
      el("div", { className: "acciones" }, guardar, cancelar));

    form.onsubmit = async (e) => {
      e.preventDefault();
      const t = tipoElegido();
      const datos = {
        titulo: titulo.value.trim(),
        contenido: contenido.value.trim() || null,
        estado: bloqueEstado.classList.contains("oculto") ? null : (estado.value || null),
        fecha: bloqueFecha.classList.contains("oculto") || !fecha.value ? null : fecha.value,
      };
      let id = n?.id;
      if (editando) {
        const { error } = await db.from("nodos").update(datos).eq("id", id);
        if (error) return avisar(error.message);
      } else {
        const { data, error } = await db.from("nodos").insert({ ...datos, tipo_id: t.id }).select("id").single();
        if (error) return avisar(error.message);
        id = data.id;
        if (relacion.value && destino.value) {
          const r = await db.from("conexiones").insert({ origen_id: id, relacion: relacion.value, destino_id: destino.value });
          if (r.error) avisar("El nodo se creó, pero la conexión falló: " + r.error.message);
        }
      }
      await cargarGrafo(id);
    };

    $("panel").replaceChildren(form);
    $("panel").classList.remove("oculto");
    ajustarCampos();
    if (cy) cy.resize();
    titulo.focus();
  }

  $("nuevo").onclick = () => formulario();

  $("form-login").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await db.auth.signInWithOtp({ email: $("correo").value, options: { emailRedirectTo: location.href } });
    avisar(error ? error.message : "Revisa tu correo y abre el enlace desde este navegador.");
  };
  $("salir").onclick = () => db.auth.signOut();

  db.auth.onAuthStateChange((_evento, sesion) => {
    mostrarApp(!!sesion);
    if (sesion) cargarGrafo(); else avisar("");
  });
</script>
</body>
</html>
