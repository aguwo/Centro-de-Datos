<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Martita</title>
  <!--
    La web de tu centro de datos. Este archivo tiene solo la estructura de la página;
    el estilo está en estilos.css y el comportamiento en js/ (empieza por js/main.js).
    Paso 26: la carcasa del escritorio. Barra arriba, dock escondido abajo y un apartado por sección.
    Paso 27: Hoy (qué hacer a la izquierda; el tiempo y tu día a la derecha).
    Paso 31: lo del Inbox como post-its pegados alrededor de las secciones (postits.js).
    Paso 30: el calendario, un cajón que sale desde el dock (calendario.js).
    Paso 29: "+ Nuevo" crea según el apartado; el formulario sale de las propiedades de cada tipo (nuevo.js).
    Paso 53: Ajustes (apariencia.js y ajustes.js): modo, color, fondo, vidrio, letra y la cuenta. Sin barra arriba.
    Paso 28: el escritorio movible. Los apartados con "lugar" se mudan solos a #mundo (escritorio.js).
    Los apartados se anotan en js/apartados.js. Los que tienen widgets se arman solos (paso 34a);
    los demás tienen aquí su <section> con el mismo id.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <!-- ?v= cambia cuando cambian los estilos: así el navegador no usa los de antes que tenía guardados -->
  <link rel="stylesheet" href="estilos.css?v=102">
</head>
<body>
  <div class="fondo" aria-hidden="true"></div>

  <section id="login" class="centro vidrio oculto">
    <h1>Martita</h1>
    <p>Entra con tu correo. Te llega un enlace para iniciar sesión.</p>
    <form id="form-login">
      <input id="correo" type="email" placeholder="tu@correo.cl" required>
      <button class="principal">Enviar enlace</button>
    </form>
  </section>

  <!-- Paso 53: sin barra arriba. «Salir» está en Ajustes y «+ Nuevo» abajo a la derecha -->
  <button id="nuevo" class="nuevo principal oculto" aria-haspopup="menu" aria-expanded="false" title="Crear algo nuevo"><span class="mas" aria-hidden="true">+</span><span class="etiqueta">Nuevo</span></button>
  <div id="menu-nuevo" class="menu vidrio" role="menu" hidden></div>
  <!-- Paso 97: la revisión de la noche (revision.js). Aparece desde las 21:00, sobre «+ Nuevo» -->
  <button id="revisar" class="revisar oculto" hidden><span class="etiqueta">Revisar el día</span></button>

  <main id="app" class="oculto">
    <div id="escritorio" class="escritorio">
      <div id="mundo">
        <!-- Paso 31: lo del Inbox como post-its (postits.js). Sin escritorio, la capa se muda arriba de Hoy. -->
        <div id="postits" class="postits" aria-label="Post-its del Inbox"></div>
      </div>
      <nav id="minimapa" class="minimapa vidrio" aria-label="Minimapa del escritorio"></nav>
    </div>

    <!-- Hoy y Productividad no están aquí: se arman solos con sus widgets (js/apartados.js y js/widgets.js). -->

    <section id="inicio" class="apartado oculto">
      <div class="saludo">
        <h2 id="fecha-hoy"></h2>
        <form id="form-captura"><input id="captura" placeholder="Captura rápida: escribe una tarea y presiona Enter…" autocomplete="off"></form>
      </div>
      <div id="senales"></div>
      <div class="tablero" id="tablero"></div>
    </section>

    <section id="mapa" class="apartado oculto">
      <div class="leyenda vidrio" id="leyenda"></div>
      <div class="lienzo-mapa vidrio"><div id="grafo"></div></div>
    </section>

    <aside id="panel" class="vidrio oculto"></aside>
  </main>

  <!-- Calendario: un cajón que sale desde la derecha (lo abre su botón al final del dock) -->
  <aside id="calendario" class="cajon vidrio" aria-label="Calendario">
    <div class="cal-lado">
      <button id="cal-crear" class="principal">+ Crear</button>
      <div id="cal-mini" class="mini-mes"></div>
      <h3>Mis calendarios</h3>
      <ul id="cal-calendarios" class="calendarios"></ul>
    </div>
    <div class="cal-principal">
      <div class="cal-barra">
        <button id="cal-hoy">Hoy</button>
        <button id="cal-ant" class="redondo" aria-label="Anterior">‹</button>
        <button id="cal-sig" class="redondo" aria-label="Siguiente">›</button>
        <b id="cal-titulo"></b>
        <div id="cal-vistas" class="segmento"><button data-vista="dia">Día</button><button data-vista="semana">Semana</button><button data-vista="mes">Mes</button></div>
        <button class="redondo" data-cerrar aria-label="Cerrar el calendario">×</button>
      </div>
      <div id="cal-cuerpo" class="agenda"></div>
    </div>
  </aside>

  <!-- Editor de un evento (como el de Google Calendar) -->
  <dialog id="editor-evento" class="dialogo vidrio">
    <form>
      <input name="titulo" class="titulo-grande" placeholder="Añade un título" required autocomplete="off">
      <div class="fila"><input name="fecha" type="date" required><label><input name="todo" type="checkbox"> Todo el día</label></div>
      <div class="fila horas"><input name="ini" type="time" step="900"><span>a</span><input name="fin" type="time" step="900"></div>
      <div class="fila"><select name="repite"></select><label class="hasta">hasta <input name="hasta" type="date"></label></div>
      <p class="aviso-repite">Se repite: los cambios valen para todas las veces.</p>
      <label class="fila">Calendario <select name="calendario"></select></label>
      <textarea name="notas" rows="2" placeholder="Añade una descripción"></textarea>
      <div class="pie">
        <button type="button" class="eliminar peligro">Eliminar</button>
        <span class="eliminar-cual">Eliminar <button type="button" class="solo-este peligro">solo este</button><button type="button" class="todos peligro">todos</button></span>
        <button type="button" class="cancelar">Cancelar</button>
        <button class="principal">Guardar</button>
      </div>
    </form>
  </dialog>

  <nav id="dock" class="dock vidrio oculto" aria-label="Apartados"></nav>
  <button id="asa" class="asa oculto" aria-label="Mostrar los apartados"></button>
  <p id="mensaje" role="status"></p>

<script type="module" src="js/main.js"></script>
</body>
</html>
