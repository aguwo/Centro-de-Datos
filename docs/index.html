<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de datos</title>
  <!--
    La web de tu centro de datos. Este archivo tiene solo la estructura de la página;
    el estilo está en estilos.css y el comportamiento en js/ (empieza por js/main.js).
    Pasos: 9-11 mapa y panel · 13 filtros · 14 cajas dentro de cajas · 15 Inicio · 18 subcajas
    · 19 la jerarquía (colores, cajas y módulos) se lee de la base · 25 Inicio por tarjetas y en tiempo real.
  -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <section id="login" class="centro oculto">
    <h1>Centro de datos</h1>
    <p>Entra con tu correo. Te llega un enlace para iniciar sesión.</p>
    <form id="form-login">
      <input id="correo" type="email" placeholder="tu@correo.cl" required>
      <button class="principal">Enviar enlace</button>
    </form>
  </section>

  <header id="barra" class="oculto">
    <h1>Centro de datos</h1>
    <nav id="menu">
      <button data-vista="inicio" class="activo">Inicio</button>
      <button data-vista="mapa">Mapa</button>
    </nav>
    <div class="leyenda oculto" id="leyenda"></div>
    <button id="nuevo" class="principal">+ Nuevo</button>
    <button id="salir">Salir</button>
  </header>
  <main id="app" class="oculto">
    <section id="inicio">
      <div class="saludo">
        <h2 id="fecha-hoy"></h2>
        <form id="form-captura"><input id="captura" placeholder="Captura rápida: escribe una tarea y presiona Enter…" autocomplete="off"></form>
      </div>
      <div id="senales"></div>
      <div class="tablero" id="tablero"></div>
    </section>
    <div id="grafo" class="oculto"></div>
    <aside id="panel" class="oculto"></aside>
  </main>
  <p id="mensaje"></p>

<script type="module" src="js/main.js"></script>
</body>
</html>
