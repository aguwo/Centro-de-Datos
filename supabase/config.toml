# Configuración local de Supabase (supabase start / supabase functions serve).
project_id = "centro-de-datos"

[functions.mcp]
# El servidor MCP valida el token por su cuenta para poder responder 401 con los
# metadatos OAuth que necesita Claude para iniciar sesión.
verify_jwt = false

[functions.eva]
# La llama la base (pg_cron) con su propia clave, no una sesión: la función la revisa por su cuenta.
verify_jwt = false
